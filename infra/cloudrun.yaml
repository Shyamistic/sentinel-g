apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sentinel-g
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '10'
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/targetUtilizationPercentage: '80'
    spec:
      containers:
      - image: gcr.io/PROJECT_ID/sentinel-g:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        env:
        - name: GCP_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: sentinel-g-config
              key: gcp-project-id
        - name: DATADOG_API_KEY
          valueFrom:
            secretKeyRef:
              name: sentinel-g-secrets
              key: datadog-api-key
        - name: DATADOG_APP_KEY
          valueFrom:
            secretKeyRef:
              name: sentinel-g-secrets
              key: datadog-app-key
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      timeoutSeconds: 300
      serviceAccountName: sentinel-g
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-g-service
spec:
  selector:
    serving.knative.dev/service: sentinel-g
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
